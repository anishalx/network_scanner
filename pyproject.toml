[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netscanner"
version = "2.0.0"
description = "Fast cross-platform network discovery and port scanning (ARP, ICMP, TCP)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Anish" }]
keywords = ["network", "scanner", "arp", "ping", "port-scan", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["scapy>=2.4.5"]

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=7.0"]

[project.scripts]
netscanner = "netscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netscanner = ["data/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Prepend src/ to sys.path so `import netscanner` resolves to the package even
# when the repo root (which contains the legacy netscanner.py shim) is on the path.
pythonpath = ["src"]
